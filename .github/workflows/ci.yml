name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit locked Windows runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --requirement requirements-windows-py312.lock --require-hashes --disable-pip

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          advanced-security: false
          online-audits: false
          inputs: .github/workflows

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Lint with ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.15.22
          python -m ruff check .

  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance scikit-learn TA-Lib

      - name: Compile core Python modules
        run: |
          python -m compileall -q .
          python -m py_compile agent_assimilation.py agent_personality.py agent_cognition.py agent_personality_practical_exam.py agent_learning_control_plane.py fundamental_learning_evaluator.py technical_research_lab.py run_technical_validation.py catalyst_taxonomy.py catalyst_trade_lens.py symbol_classification.py information_ledger.py experiment_registry.py outcome_tracker.py run_context.py run_manifest.py research_readiness.py full_research_preflight.py prepare_full_research_universe.py thymios_order_intent.py koulis_risk_gate.py alpaca_paper_trader.py miltos_entry_stalker.py us_equity_monitor.py giannis_rule_based_from_shortlist.py yankos_strategy_agent.py periklis_strategy_agent.py petros_agent.py petros_features.py petros_trainer.py strategy_scorecards.py strategy_backtest.py symbol_research_dashboard.py
          python agent_assimilation.py verify --contract ecosystem_theory_contract.json --reports-dir docs/agent_reports
          python agent_personality_practical_exam.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
