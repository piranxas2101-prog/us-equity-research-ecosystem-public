display_information:
  name: Market Research Team
  description: Research-only group conversations with the local agent ecosystem
  background_color: "#17324D"
features:
  bot_user:
    display_name: Market Research Team
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - groups:history
      - groups:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
